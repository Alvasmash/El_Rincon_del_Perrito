<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenedor de Productos — Admin</title>

    <!-- Hojas de estilo utilizadas por el mantenedor de productos. -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <!-- Icono mostrado en la pestaña del navegador. -->
    <link rel="icon" type="image/png" href="../Imagenes/pata_perrito.png">
</head>

<body>
    <div class="layout-admin">

        <!-- Barra lateral de navegación del panel. -->
        <aside class="sidebar-admin">
            <div class="sidebar-encabezado">
                <img src="../Imagenes/pata_perrito.png" alt="Logo">
                <span>Panel de Gestión</span>
            </div>

            <!-- Opciones disponibles dentro del panel administrativo. -->
            <nav class="sidebar-menu">
                <a href="index.html" class="sidebar-link">
                    <span>📊</span> Dashboard
                </a>

                <a href="productos.html" class="sidebar-link activo">
                    <span>📦</span> Productos
                </a>

                <a href="producto-form.html" class="sidebar-link" id="link-sidebar-nuevo-prod">
                    <span>➕</span> Nuevo Producto
                </a>

                <a href="usuarios.html" class="sidebar-link" id="link-sidebar-usuarios">
                    <span>👥</span> Usuarios
                </a>

                <a href="usuario-form.html" class="sidebar-link" id="link-sidebar-nuevo-usr">
                    <span>👤</span> Nuevo Usuario
                </a>

                <a href="ordenes.html" class="sidebar-link">
                    <span>📑</span> Órdenes
                </a>
            </nav>

            <!-- Acciones generales del panel. -->
            <div class="sidebar-footer">
                <a href="../html/index.html" class="sidebar-link" style="color: var(--celeste-suave);">
                    <span>🏠</span> Ir a la Tienda
                </a>

                <a href="javascript:void(0)" onclick="cerrarSesionUsuario()" class="sidebar-link" style="color: #FF9B9B;">
                    <span>🚪</span> Cerrar Sesión
                </a>
            </div>
        </aside>

        <div class="contenido-admin">

            <!-- Barra superior con información del usuario actual. -->
            <header class="topbar-admin">
                <h1>Mantenedor de Productos</h1>

                <div class="topbar-usuario">
                    <span id="nombre-usuario-admin">Cargando usuario...</span>
                    <span class="badge badge-info" id="rol-usuario-admin">Rol</span>
                </div>
            </header>

            <main class="panel-principal">

                <!-- Contenedor principal de la tabla de productos. -->
                <div class="tarjeta-tabla">

                    <!-- Buscador, filtro de categoría y botón para crear productos. -->
                    <div class="tabla-header">
                        <div class="tabla-filtros">

                            <!-- Permite buscar productos por nombre o código. -->
                            <input
                                type="text"
                                id="filtro-buscar"
                                placeholder="Buscar por nombre o código..."
                            >

                            <!-- Permite filtrar los productos por categoría. -->
                            <select id="filtro-categoria">
                                <option value="">Todas las categorías</option>
                                <option value="camas">Camas</option>
                                <option value="juguetes">Juguetes</option>
                                <option value="collares">Collares</option>
                            </select>
                        </div>

                        <!-- Redirige al formulario para crear un nuevo producto. -->
                        <a href="producto-form.html" class="boton" id="btn-nuevo-producto">
                            ➕ Nuevo Producto
                        </a>
                    </div>

                    <!-- Permite desplazar la tabla horizontalmente en pantallas pequeñas. -->
                    <div class="tabla-responsive">
                        <table class="tabla-admin">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre del Producto</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th>Stock Crítico</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>

                            <!-- admin-productos.js genera las filas de productos aquí. -->
                            <tbody id="tabla-productos-body">
                                <tr>
                                    <td colspan="7" style="text-align: center; padding: 20px;">
                                        Cargando inventario...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Archivos con datos, autenticación y funciones del mantenedor. -->
    <script src="../js/productos-data.js"></script>
    <script src="../js/usuarios-data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/admin-productos.js"></script>
</body>
</html>
