<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Perritos</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<header>
    <div class="contenedor-header">
        <img src="../Imagenes/pata_perrito.png" alt="Logo" class="logo">
        <h1>Tienda Perritos</h1>
    </div>
</header>

<section class="banner">
    <img src="../Imagenes/banner.jpg" alt="Banner">
</section>

<section class="productos">

    <div class="card">
        <img src="../Imagenes/collar.png" alt="">
        <h3>Collar</h3>
        <p>$5.990</p>
        <button>Comprar</button>
    </div>

    <div class="card">
        <img src="../Imagenes/juguetes.png" alt="">
        <h3>Juguete</h3>
        <p>$3.490</p>
        <button>Comprar</button>
    </div>

    <div class="card">
        <img src="../Imagenes/cama.png" alt="">
        <h3>Cama</h3>
        <p>$14.990</p>
        <button>Comprar</button>
    </div>

</section>

<footer>
    © 2026 Tienda Perritos
</footer>

</body>
</html>
