<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Perritos</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<header>
    <div class="contenedor-header">
        <img src="../Imagenes/pata_perrito.png" alt="Logo" class="logo">
        <h1>Tienda Perritos</h1>
    </div>
</header>

<section class="banner">
    <img src="../Imagenes/banner.jpg" alt="Banner">
</section>

<section class="productos">

    <div class="card">
        <img src="../Imagenes/collar.png" alt="">
        <h3>Collar</h3>
        <p>$5.990</p>
        <button>Comprar</button>
    </div>

    <div class="card">
        <img src="../Imagenes/juguetes.png" alt="">
        <h3>Juguete</h3>
        <p>$3.490</p>
        <button>Comprar</button>
    </div>

    <div class="card">
        <img src="../Imagenes/cama.png" alt="">
        <h3>Cama</h3>
        <p>$14.990</p>
        <button>Comprar</button>
    </div>

</section>

<footer class="footer">

    <div class="footer-info">
        <h2>Tienda Perritos</h2>
        <p>Los mejores accesorios y productos para tu mascota.</p>

        <p><strong>Correo:</strong> contacto@tiendaperritos.cl</p>
        <p><strong>Teléfono:</strong> +56 9 1234 5678</p>
    </div>

    <div class="footer-contacto">
        <h3>Contáctanos</h3>

        <form>
            <input type="text" placeholder="Tu nombre" required>
            <input type="email" placeholder="Tu correo" required>
            <textarea placeholder="Escribe tu mensaje..." rows="5" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </div>

</footer>

<footer>
    © 2026 Tienda Perritos
</footer>

</body>
</html>
