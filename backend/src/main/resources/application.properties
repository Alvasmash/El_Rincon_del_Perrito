spring.application.name=el-rincon-del-perrito-backend
server.port=${SERVER_PORT:8080}

# Configuracion de conexion a MySQL 8.4 (compatible con IntelliJ local y Docker Compose)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:rincon_perrito}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracion JWT
jwt.secret=${JWT_SECRET:ElRinconDelPerritoClaveSecretaParaEvaluacion3FullStack2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

