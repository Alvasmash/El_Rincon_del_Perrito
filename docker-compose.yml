services:
  mysql:
    image: mysql:8.4
    container_name: rincon-perrito-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rincon_perrito}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rincon-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rincon-perrito-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-rincon_perrito}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      JWT_SECRET: ${JWT_SECRET:-ElRinconDelPerritoClaveSecretaParaEvaluacion3FullStack2026!}
    ports:
      - "8080:8080"
    networks:
      - rincon-network

volumes:
  mysql_data:

networks:
  rincon-network:
    driver: bridge

